name: equity-research-lab
on:
  push:
    branches: [main]
    paths: ["projects/13-equity-research-lab/**", ".github/workflows/equity-research-lab.yml"]
  pull_request:
    paths: ["projects/13-equity-research-lab/**", ".github/workflows/equity-research-lab.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/13-equity-research-lab
    env:
      NEXT_PUBLIC_APP_MODE: demo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/13-equity-research-lab/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
